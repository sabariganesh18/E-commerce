<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukuna Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-content">
      <h1 class="logo">Sukuna Store</h1>
      <div class="nav-actions">
        <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()">
        <button class="cart-btn" onclick="toggleCart()">
          🛒 Cart (<span id="cartCount">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- Product Section -->
  <main class="container main-layout">
    <div class="filters">
      <button class="filter-btn active" onclick="setCategory('all', this)">All</button>
      <button class="filter-btn" onclick="setCategory('groceries', this)">Groceries</button>
      <button class="filter-btn" onclick="setCategory('mobiles', this)">Mobiles & Accessories</button>
      <button class="filter-btn" onclick="setCategory('books', this)">Books</button>
      <button class="filter-btn" onclick="setCategory('men', this)">Men</button>
      <button class="filter-btn" onclick="setCategory('women', this)">Women</button>
      <button class="filter-btn" onclick="setCategory('kids', this)">Kids</button>
      <button class="filter-btn" onclick="setCategory('watches', this)">Watches</button>
    </div>

    <div class="product-grid" id="productGrid">
      <!-- Products loaded via JS -->
    </div>
  </main>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-box">
      <div class="cart-header">
        <h2>Your Shopping Cart</h2>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>
      <div class="cart-items" id="cartItems">
        <!-- Cart items loaded via JS -->
      </div>
      <div class="cart-footer">
        <div class="total-row">
          <span>Total:</span>
          <strong id="cartTotal">₹0.00</strong>
        </div>
        <button class="checkout-btn" onclick="checkout()">Checkout</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
